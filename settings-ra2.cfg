#----------------------------------------------------------------------------------------------------------
# settings-ra2.cfg - Configuration file for INI2MAP Tester 1.0 (Red Alert 2 build)
#----------------------------------------------------------------------------------------------------------
# Place this file in the same directory as main.tcl (as settings.cfg).
# Settings defined here override the default values.
# This file returns a dict with configuration key-value pairs.
#----------------------------------------------------------------------------------------------------------

return [dict create \
    ra2dir "./" \
    ra2rul "rules.enc" \
    ra2ai  "ai.enc" \
    ra2art "art.enc" \
    ra2snd "sound.enc" \
    ra2tm  "theme.enc" \
    ra2eva "eva.enc" \
    gamemode "ra2" \
    savelog 0 \
    writeanims 1 \
    showunused 1 \
    paranoid 1 \
    auto_open_log 1 \
    ini_encoding "" \
    sound_validation 1 \
    sound_check_audio 1 \
    sound_warn_unused 1 \
    sound_warn_duplicate_resources 0 \
    sound_warn_orphan_resources 1 \
    crypto_dll_expected_hash "6d6bee1e4d33f2120b0bbc7407b52130fa21f916f31eda72b4a5544c5461ccb2" \
    salt_scope "ra2mt" \
    tclsh_path "" \
]
